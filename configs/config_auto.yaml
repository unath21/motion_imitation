# SimpleViT MAE Pretraining Configuration

# General training parameters
seed: 42
total_epoch: 1000
warmup_epoch: 5

# Data parameters
# Data configuration
data:
  root: "/data/pturaga/datasets/Penn_Action/"  # Path to Penn Action frames directory
  train_pairs_json: "./data/train_set.json"  # JSON file with frame pairs for training
  val_pairs_json: "./data/val_set.json"      # JSON file with frame pairs for validation
  frame_size: 256                       # Size to resize frames to
  num_workers: 32                        # Number of data loading workers

# Model parameters
model:
  type: "autoencoder_v2"  # Options: "autoencoder", "dino"
  image_size: 256
  patch_size: 16
  latent_dim: 64

# Training parameters
train:
  batch_size: 512
  max_device_batch_size: 64
  base_learning_rate: 1.5e-4
  weight_decay: 0.05
  gradient_clip_norm: 1.0

# Accelerate configuration
accelerate:
  mixed_precision: 'bf16'  # Options: 'no', 'fp16', 'bf16'
  gradient_accumulation_steps: 1
  config_file: './accelerate_config.yaml'

# Logging parameters
logging:
  model_save_path: '/scratch/unath/motion_emitation_data/model_image_difference/auto_unet.pt'
  tensorboard_log_dir: '/scratch/unath/motion_emitation_data/tensorboard_logs'

# WandB configuration
wandb:
  enable: true
  project: 'motion_emitation'
  run_name: 'image_difference'
  mode: 'online'  # Options: 'online', 'offline', 'disabled'
  dir: '/scratch/unath/motion_emitation_data/wandb_logs'

# Validation parameters
validation:
  log_images_every: 50
  num_samples_to_log: 40
  save_model_every: 50  # Save model every N epochs
